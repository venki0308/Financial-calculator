<!doctype html>
<html lang="en-IN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
      /* Before first paint: the saved theme, else the device setting (default light). */
      (function () {
        var d = document.documentElement, t = null;
        try { t = localStorage.getItem('fincalix_site_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.setAttribute('data-theme', t);
      })();
    </script>
    <!--landing-head-->
  </head>
  <body>
    <!--landing-app-->
    <script type="module" src="/src/landing/entry-client.tsx"></script>
  </body>
</html>
