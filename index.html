<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icons/fincalix-logo.png" />
  <!-- Pinch-zoom is allowed on the web. The Android app locks the scale at
       start-up (src/main.tsx), as it did before. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Prevents Android from activating assistive overlays (clipboard bar, link
       detection, phone/email/address auto-detection) on input fields, which
       causes a floating card to appear above the keyboard in Capacitor apps. -->
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no, url=no" />

  <!-- App shell. On the web it is served as /app.html for every app route; the
       canonical link (or noindex) for each route is sent as an HTTP header from
       vercel.json, and the indexed pages are the website at "/" and the static
       calculator pages. -->
  <title>FinCalix — Money calculators for India</title>
  <meta name="description" content="EMI, SIP, FD, PPF and income tax calculators for India, with an expense tracker and government schemes. No login. 6 Indian languages." />
  <meta name="application-name" content="FinCalix" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FinCalix" />
  <meta property="og:title" content="FinCalix — Money calculators for India" />
  <meta property="og:description" content="EMI, SIP, FD, PPF and income tax calculators for India. No login. 6 Indian languages." />
  <meta property="og:image" content="https://fincalix.com/og/fincalix-og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_IN" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Mobile App Meta -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinCalix" />
  <meta name="theme-color" content="#0F172A" />
  <link rel="apple-touch-icon" href="/icons/fincalix-logo.png" />
  <meta name="google-play-app" content="app-id=com.fincalix.app" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Fonts — async (non-render-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    // Offline cache only inside the Android app (Capacitor). On the web the app
    // runs only in dev mode, without a service worker: remove any left from earlier versions.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (native) {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        } else {
          navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
        }
      });
    }
  </script>
</body>

</html>
