<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icons/fincalix-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

  <!-- Primary SEO -->
  <title>FinCalix — Free Financial Calculator App India</title>
  <meta name="description" content="India's best free financial calculator app. SIP, EMI, FD, PPF, HRA, GST, Income Tax, Expense Tracker. No login. Works offline. Download free on Play Store." />
  <meta name="keywords" content="SIP calculator, EMI calculator, FD calculator, PPF calculator, income tax calculator India, financial calculator app, free calculator app India, Budget 2026" />
  <meta name="author" content="FinCalix" />
  <link rel="canonical" href="https://fincalix.com/" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Theme -->
  <meta name="theme-color" content="#0A1628" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FinCalix" />
  <meta property="og:title" content="FinCalix — Smart Finance Calculator" />
  <meta property="og:description" content="50+ free financial calculators for India. SIP, EMI, FD, PPF, HRA, GST, Income Tax. Budget 2026-27 updated. No login. Works offline." />
  <meta property="og:image" content="https://fincalix.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://fincalix.com/" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FinCalix — Smart Finance Calculator" />
  <meta name="twitter:description" content="50+ free financial calculators for India. Budget 2026-27 updated. No login, works offline." />
  <meta name="twitter:image" content="https://fincalix.com/og-image.png" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Apple PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinCalix" />
  <link rel="apple-touch-icon" href="/icons/fincalix-logo.png" />

  <!-- Google Play App -->
  <meta name="google-play-app" content="app-id=com.fincalix.app" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "FinCalix",
    "description": "India's most complete financial calculator app. SIP, EMI, FD, PPF, HRA, GST, Income Tax and 50+ more calculators. Free, offline, no login.",
    "url": "https://fincalix.com",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Android",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "INR"
    },
    "author": {
      "@type": "Organization",
      "name": "FinCalix",
      "url": "https://fincalix.com"
    },
    "inLanguage": "en-IN",
    "installUrl": "https://play.google.com/store/apps/details?id=com.fincalix.app"
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>

</html>
