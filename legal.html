<!doctype html>
<html lang="en-IN" data-theme="light" style="color-scheme:light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F8FAFC">
    <script>
      /* Light unless the visitor chose dark on this site (never the device setting). The HTML is
         pre-rendered light; for dark it stays hidden (dark background) until legal-client.tsx
         has re-rendered it, so it never flashes light. */
      (function () {
        var d = document.documentElement, t = null;
        try { t = localStorage.getItem('fincalix_web_theme'); } catch (e) {}
        if (t !== 'dark') return;
        d.setAttribute('data-theme', 'dark');
        d.style.colorScheme = 'dark';
        d.style.background = '#0F172A';
        d.style.visibility = 'hidden';
        setTimeout(function () { d.style.visibility = ''; }, 1500);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F172A');
      })();
    </script>
    <!--legal-head-->
  </head>
  <body style="margin:0">
    <div id="root"><!--legal-app--></div>
    <!--legal-data-->
    <script type="module" src="/src/landing/legal-client.tsx"></script>
  </body>
</html>
